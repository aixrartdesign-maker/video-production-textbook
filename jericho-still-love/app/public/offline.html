<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>그럼에도, 사랑하시기에</title>
    <meta name="theme-color" content="#14110e" />
    <style>
      html, body { margin: 0; height: 100%; background: #14110e; color: #efe6d2; font: 17px/1.6 "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; word-break: keep-all; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      button { font: inherit; color: #14110e; background: #e3b857; border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <p>인터넷에 연결되어 있지 않습니다.<br />연결을 확인한 뒤 다시 열어 주세요.</p>
      <button type="button" onclick="location.reload()">다시 열기</button>
    </main>
  </body>
</html>
